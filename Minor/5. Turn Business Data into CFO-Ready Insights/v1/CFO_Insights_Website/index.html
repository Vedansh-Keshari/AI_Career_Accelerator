.sub{color:var(--mute);font-style:italic;font-family:Georgia,serif}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}

nav button.on{color:var(--ink);border-color:var(--sage)}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px}

.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:40px}.card{background:var(--card);border:1px solid var(--line);padding:20px 22px}
table{width:100%;border-collapse:collapse}th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--sage);font-weight:500}
td{padding:9px 10px;border-bottom:1px solid var(--line)}tr:hover td{background:var(--pale)}.num{text-align:right;font-variant-numeric:tabular-nums}th.num{text-align:right}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}
.chip{font-size:11px;padding:2px 9px;border-radius:10px}.Paid{background:#DDE6D8;color:#3E5239}.Pending{background:#F3EBD6;color:#6E5A22}.Overdue{background:#EFD9D4;color:#7A3A2E}
.bar{height:6px;background:var(--pale);min-width:70px}.bar i{display:block;height:100%;background:var(--sage)}
ul.n{padding:0;list-style:none;margin:0}ul.n li{padding:10px 0;border-bottom:1px solid var(--line);font-family:Georgia,serif}ul.n li:before{content:"— ";color:var(--sage)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{min-width:240px}.scroll{overflow-x:auto}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:6px;cursor:help}
.up{color:#5C7A57}.dn{color:#B0675A}.hm td.h{text-align:right}.legend{font-size:11px;color:var(--mute)}
section{display:none}section.on{display:block}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.btn{cursor:pointer;border:1px solid var(--sage);color:var(--ink);padding:8px 14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:2px}.btn:hover{background:var(--pale)}

.sticky{position:relative;margin:64px auto 0;max-width:600px;background:#F7EDB5;color:#3A3420;padding:28px 30px 24px;transform:rotate(-1deg);box-shadow:0 12px 26px rgba(0,0,0,.16),inset 0 -26px 34px -28px rgba(0,0,0,.2);font-family:"Segoe Print","Bradley Hand","Comic Sans MS",Georgia,cursive}

.sticky ul{margin:0;padding-left:18px}.sticky li{margin:5px 0;font-size:13.5px;line-height:1.45}
</style>
</head>

const DAY=864e5,ASOF=Date.UTC(2026,9,22)/DAY,ISOF=d=>new Date(d*DAY).toISOString().slice(0,10);
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const mk=(y,m,d)=>{const t=Date.UTC(y,m,d),x=new Date(t);return x.getUTCMonth()===m&&x.getUTCDate()===d?t/DAY:undefined};
const blank=s=>{s=String(s??"").trim();return /^(|nan|none|nat|null|n\/a|-|not yet)$/i.test(s)?null:s};
const y2=y=>y<100?y+2000:y,title=s=>s.toLowerCase().replace(/(^|[^a-z])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function pDate(s){let m;

 if(m=s.match(/^(\d{1,2})[ \-]([A-Za-z]{3,9})\.?,?[ \-](\d{2,4})$/)){const mo=MON[m[2].slice(0,3).toLowerCase()];return mo==null?undefined:mk(y2(+m[3]),mo,+m[1])}

function parseCSV(t){const rows=[];let r=[],f="",q=false;

  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==","){r.push(f);f=""}

const ckey=n=>String(n).toLowerCase().replace(/&/g," and ").replace(/\b(inc|ltd|llc|corp|corporation|co|company|pvt|and)\b/g,"").replace(/[^a-z]/g,"");

function cleanRows(raw){
 const fx={},ALIAS={"Amount(USD)":"Amount",any_notes_or_remarks:"Notes"};
 if(!raw.length)throw new Error("The file has no rows.");
 let rows=raw.map(r=>{const o={};for(const k in r){const kk=k.trim();o[ALIAS[kk]||kk]=r[k]}return o});
 const miss=["Invoice_ID","Client_name","Issue_date","Amount"].filter(c=>!(c in rows[0]));
 if(miss.length)throw new Error("Missing column(s): "+miss.join(", ")+". Expected: Invoice_ID, Client_name, Issue_date, Due_date, Amount(USD), Payment_status, Payment_date, Project_type, any_notes_or_remarks");
 let d=rows.map(r=>({id:String(r.Invoice_ID??"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^INV-?(\d+)$/,"INV-$1"),rc:String(r.Client_name??""),ri:String(r.Issue_date??""),ra:String(r.Amount??""),
  c:r.Client_name,iss:r.Issue_date,due:r.Due_date,pay:r.Payment_date,st:r.Payment_status,type:r.Project_type,notes:r.Notes,n:[]}));
 const add=(r,m)=>{r.n.push(m);fx[m]=(fx[m]||0)+1};
 const last=new Map();d.forEach((r,i)=>last.set(r.id,i));const nd=d.length;d=d.filter((r,i)=>last.get(r.id)===i);
 if(nd>d.length)fx["Duplicate / superseded invoice rows merged"]=nd-d.length;
 // clients
 const nm=d.map(r=>{const b=blank(r.c);return b==null?"Unknown Client":b.replace(/\s+/g," ").replace(/^[ .]+|[ .]+$/g,"")});
 const cnt=new Map();nm.forEach(n=>cnt.set(n,(cnt.get(n)||0)+1));
 const order=[...cnt.keys()].sort((a,b)=>cnt.get(b)-cnt.get(a)),canon=new Map(),mp=new Map();
 order.forEach(name=>{let k=ckey(name)||name.toLowerCase(),best=null,bs=-1;
  for(const c of canon.keys()){const s=ratio(k,c);if(s>=0.85&&(s>bs||(s===bs&&c>best))){bs=s;best=c}}
  if(best!=null)k=best;else canon.set(k,(name===name.toUpperCase()&&name!==name.toLowerCase())||(name===name.toLowerCase()&&name!==name.toUpperCase())?title(name):name);
  mp.set(name,canon.get(k))});
 d.forEach((r,i)=>{r.client=mp.get(nm[i]);if(r.client!==r.rc.trim())add(r,"Client name standardised")});
 // dates
 for(const [f,fld,lab] of [["iss","issue","Issue_date"],["due","due2","Due_date"],["pay","pay2","Payment_date"]])
  d.forEach(r=>{const s=blank(r[f]);let p=null;
   if(s!=null){p=pDate(s);if(p===undefined){add(r,`Unreadable ${lab} cleared`);p=null}else if(!/^\d{4}-\d{2}-\d{2}$/.test(s))add(r,`${lab} format standardised`)}
   r[fld]=p});
 d.forEach(r=>{if(r.issue==null&&r.due2!=null){r.issue=r.due2-30;add(r,"Missing issue date filled (due date - 30d)")}});
 d.forEach(r=>{if(r.due2==null){r.due2=r.issue==null?null:r.issue+30;add(r,"Missing due date filled (issue date + 30d)")}});
 const nb=d.length;d=d.filter(r=>r.issue!=null);if(nb>d.length)fx["Rows dropped (no usable issue or due date)"]=nb-d.length;
 // amounts
 d.forEach(r=>{const t=String(r.ra),c=t.replace(/[^0-9.\-]/g,"");r.a=c===""?NaN:Number(c);
  if(!isNaN(r.a)&&!/^-?[0-9.]+$/.test(t))add(r,"Amount format standardised");
  if(r.a<0)add(r,"Negative amount corrected to positive");r.a=Math.abs(r.a)});
 const cm=new Map([...by(d,r=>r.client)].map(([k,v])=>[k,med(v.map(r=>r.a))])),gm=med(d.map(r=>r.a));
 d.forEach(r=>{if(isNaN(r.a)){const m=cm.get(r.client);r.a=isNaN(m)?gm:m;add(r,"Missing amount estimated from client median - verify")}r.a=r2(isNaN(r.a)?0:r.a)});

  r.rawPaid=/paid|settled|received|cleared/.test(s)&&!/unpaid|not/.test(s);r.rawFinal=r.rawPaid?"Paid":/overdue|late/.test(s)?"Overdue":"Pending";

 d.forEach(r=>{if(r.pay2!=null&&r.pay2<r.issue)add(r,"Payment date is before issue date - please verify")});

  if(r.blankSt)add(r,"Missing status derived from dates");else if(r.rawFinal!==r.status)add(r,"Status recalculated from dates")});

 $("#dq").innerHTML=`<h2>What was cleaned</h2><div class="card"><table>${fx.map(([a,b])=>`<tr><td>${a}</td><td class="num">${b}</td></tr>`).join("")}</table></div>
 <h2>Raw vs cleaned (sample)</h2><div class="card scroll"><table><tr><th>Invoice</th><th>Client raw → clean</th><th>Issue raw → clean</th><th>Amount raw → clean</th></tr>${fl.map(r=>`<tr><td>${r.Invoice_ID}</td><td>${r.Raw_client||"(blank)"} → <b>${r.Client_name}</b></td><td>${r.Raw_issue} → <b>${r.Issue_date}</b></td><td>${r.Raw_amount||"(blank)"} → <b>${usd(r.Amount)}</b></td></tr>`).join("")}</table></div>`;
}
function renderInv(){
 const cs=[...new Set(D.inv.map(r=>r.Client_name))].sort();
 if(!$("#inv").innerHTML){$("#inv").innerHTML=`<h2>All invoices</h2><div class="tools"><input id="q" placeholder="Search invoice, client, project, note…"><select id="fs"><option value="">All statuses</option><option>Paid</option><option>Pending</option><option>Overdue</option></select><select id="fc"></select><span class="legend" id="cnt" style="align-self:center"></span></div><div class="card scroll"><table id="tb"></table></div>`;
  ["#q","#fs","#fc"].forEach(s=>$(s).addEventListener("input",tbl))}
 $("#fc").innerHTML="<option value=''>All clients</option>"+cs.map(c=>`<option>${c}</option>`).join("");tbl()}
const H=[["Invoice_ID","Invoice"],["Client_name","Client"],["Issue_date","Issued"],["Due_date","Due"],["Amount","Amount"],["Payment_status","Status"],["Payment_date","Paid on"],["Project_type","Project"],["Overdue_days","Overdue days"]];
function tbl(){const q=$("#q").value.toLowerCase(),fs=$("#fs").value,fc=$("#fc").value;
 let r=D.inv.filter(x=>(!fs||x.Payment_status==fs)&&(!fc||x.Client_name==fc)&&(!q||[x.Invoice_ID,x.Client_name,x.Project_type,x.Notes].join(" ").toLowerCase().includes(q)));
 r.sort((a,b)=>(a[sortKey]>b[sortKey]?1:a[sortKey]<b[sortKey]?-1:0)*sortDir);
 $("#cnt").textContent=r.length+" invoices · "+usd(r.reduce((a,x)=>a+x.Amount,0));
 $("#tb").innerHTML=`<tr>${H.map(([k,l])=>`<th class="s ${k=="Amount"||k=="Overdue_days"?"num":""}" data-k="${k}">${l}${sortKey==k?(sortDir>0?" ▲":" ▼"):""}</th>`).join("")}</tr>`+r.map(x=>`<tr><td>${x.Invoice_ID}</td><td>${x.Client_name}</td><td>${x.Issue_date}</td><td>${x.Due_date}</td><td class="num">${usd(x.Amount)}${x.Data_Notes?`<span class="dot" title="Cleaning notes: ${x.Data_Notes.replace(/"/g,"'")}"></span>`:""}</td><td><span class="chip ${x.Payment_status}">${x.Payment_status}</span></td><td>${x.Payment_date||"–"}</td><td>${x.Project_type}${x.Notes?` <span class="legend" title="${x.Notes}">· ${x.Notes}</span>`:""}</td><td class="num">${x.Overdue_days||"–"}</td></tr>`).join("");
 $("#tb").querySelectorAll("th.s").forEach(t=>t.onclick=()=>{const k=t.dataset.k;sortDir=sortKey==k?-sortDir:1;sortKey=k;tbl()})}
$("#nav").addEventListener("click",e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll("nav button,section").forEach(x=>x.classList.remove("on"));e.target.classList.add("on");$("#"+t).classList.add("on")});
$("#ds").addEventListener("change",()=>{$("#inv").innerHTML="";render()});
$("#up").addEventListener("change",e=>{if(e.target.files.length)handleFiles([...e.target.files])});
render();
</script></body></html>
