.sub{color:var(--mute);font-style:italic;font-family:Georgia,serif}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}

.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:40px}.card{background:var(--card);border:1px solid var(--line);padding:20px 22px}
table{width:100%;border-collapse:collapse}th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--sage);font-weight:500}
td{padding:9px 10px;border-bottom:1px solid var(--line)}tr:hover td{background:var(--pale)}.num{text-align:right;font-variant-numeric:tabular-nums}th.num{text-align:right}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}
.chip{font-size:11px;padding:2px 9px;border-radius:10px}.Paid{background:#DDE6D8;color:#3E5239}.Pending{background:#F3EBD6;color:#6E5A22}.Overdue{background:#EFD9D4;color:#7A3A2E}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{min-width:240px}.scroll{overflow-x:auto}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:6px;cursor:help}
.up{color:#5C7A57}.dn{color:#B0675A}.hm td.h{text-align:right}.legend{font-size:11px;color:var(--mute)}
section{display:none}section.on{display:block}

.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.btn{cursor:pointer;border:1px solid var(--sage);color:var(--ink);padding:8px 14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:2px}.btn:hover{background:var(--pale)}

function lookup(c,f,v){let rs=c.inv;const bits=[];
 if(f.client){rs=rs.filter(r=>r.Client_name===f.client);bits.push(`client ${f.client}`)}
 if(f.min!==undefined){rs=rs.filter(r=>r.Amount>f.min);bits.push(`amount over ${money(f.min)}`)}
 if(f.max!==undefined){rs=rs.filter(r=>r.Amount<f.max);bits.push(`amount under ${money(f.max)}`)}
 if(f.status){rs=rs.filter(r=>f.status==="Open"?r.Payment_status!=="Paid":r.Payment_status===f.status);bits.push(`status ${f.status.toLowerCase()}`)}
 if(f.type){rs=rs.filter(r=>r.Project_type===f.type);bits.push(`project ${f.type}`)}
 if(f.month){rs=rs.filter(r=>+r.Issue_date.slice(5,7)===f.month);bits.push(`issued in ${QA_MON[f.month-1]}`)}
 if(!rs.length)return{text:`No invoices match ${bits.join(", ")}.`,table:null,chart:null,follow:FOLLOW_DEFAULT};
 return{text:`I found **${plural(rs.length,"invoice")}** matching ${bits.join(", ")}, worth **${money(ssum(rs,"Amount"))}** in total.`,
  table:T(["Invoice","Client","Issued","Amount","Status","Overdue days"],rs.slice(0,15).map(r=>[r.Invoice_ID,r.Client_name,r.Issue_date,money(r.Amount),r.Payment_status,String(r.Overdue_days)])),chart:null,follow:["f6","f25"]}}

 return{text:`${O(v,"Here is","Here you go:","This is")} the **${t.toLowerCase()}** chart. ${take}`,table:null,chart:gid,follow:FOLLOW_DEFAULT.filter(x=>x!==gid).slice(0,3)}}
function respond(q,c,faq,arg,v){let out;

function drawSpec(sp){const f=v=>fmtv(v,sp.fmt),W=640,Hh=240;let h=`<div class="gtitle">${esc(sp.title)}</div>`;
 if(sp.kind==="heat"){const mx=Math.max(...sp.z.flat(),1);return h+`<div class="scroll"><table class="hm"><tr><th>Client</th>${sp.cols.map(q=>`<th class="num">${q}</th>`).join("")}</tr>${sp.labels.map((l,i)=>`<tr><td>${esc(l)}</td>${sp.z[i].map(z=>`<td class="h" style="background:color-mix(in srgb,var(--sage) ${Math.round(z/mx*70)}%,transparent)">${f(z)}</td>`).join("")}</tr>`).join("")}</table></div>`}

 const all=sp.series.flatMap(s=>s.values),mn=Math.min(0,...all),mx=Math.max(0,...all)||1,pl=44,pt=14,pb=26,ph=Hh-pt-pb,y=v=>pt+(mx-v)/(mx-mn||1)*ph,n=sp.labels.length,bw=(W-pl-10)/n;
 let s=`<svg viewBox="0 0 ${W} ${Hh}" width="100%"><line x1="${pl}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(mx)+3}" text-anchor="end" font-size="9" fill="var(--mute)">${f(mx)}</text>`;
 if(mn<0)s+=`<text x="${pl-4}" y="${y(mn)+3}" text-anchor="end" font-size="9" fill="var(--mute)">${f(mn)}</text>`;
 if(sp.kind==="line"){sp.series.forEach((se,k)=>{const x=i=>pl+bw*(i+.5);s+=`<polyline fill="none" stroke="${k?"#C98E82":"var(--sage)"}" stroke-width="2" ${k?'stroke-dasharray="4 3"':""} points="${se.values.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`+se.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${k?"#C98E82":"var(--sage)"}"><title>${esc(se.name)} ${esc(sp.labels[i])}: ${f(v)}</title></circle>`).join("")})}
 else sp.series.forEach((se,k)=>se.values.forEach((v,i)=>{const x=pl+i*bw+bw*.15,hgt=Math.abs(y(v)-y(0)),top=v>=0?y(v):y(0),col=sp.series.length>1?(k?"var(--sage)":"var(--sage2)"):(v<0?"#C98E82":"var(--sage)");
  s+=`<rect x="${x}" y="${top}" width="${bw*.7}" height="${hgt}" fill="${col}"><title>${esc(se.name)} ${esc(sp.labels[i])}: ${f(v)}</title></rect>`;if(sp.series.length===1&&n<=14)s+=`<text x="${x+bw*.35}" y="${top-3}" text-anchor="middle" font-size="9" fill="var(--mute)">${f(v)}</text>`}));
 s+=sp.labels.map((l,i)=>`<text x="${pl+bw*(i+.5)}" y="${Hh-8}" text-anchor="middle" font-size="9" fill="var(--mute)">${esc(l.length>9?l.slice(0,8)+"…":l)}</text>`).join("")+"</svg>";
 return h+s+(sp.series.length>1?`<div class="legend">${sp.series.map((x,k)=>(k?"Dark: ":"Light: ")+x.name).join(" · ")}</div>`:"")}
