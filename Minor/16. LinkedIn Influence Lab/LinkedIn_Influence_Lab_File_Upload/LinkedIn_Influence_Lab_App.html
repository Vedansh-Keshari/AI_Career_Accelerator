<style>
:root{--navy:#1b3a6b;--blue:#0a66c2;--yel:#fcc94a;--bg:#eaf2fb;--card:#fff;--ink:#14213d;--mut:#5b6b86;--line:#d3deee;--h:#1b3a6b;--ok:#157f3b;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2c;--card:#16263f;--ink:#e8eefc;--mut:#9db0cf;--line:#2a3e5e;--h:#9cc4ff;--ok:#5fd38d;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1a2c;--card:#16263f;--ink:#e8eefc;--mut:#9db0cf;--line:#2a3e5e;--h:#9cc4ff;--ok:#5fd38d;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Arial,Helvetica,sans-serif}
header{background:linear-gradient(120deg,#1b3a6b,#0a66c2);color:#fff;padding:22px 18px 16px}
header h1{margin:0 0 4px;font-size:26px}header p{margin:0;opacity:.92}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.meta span{background:rgba(255,255,255,.16);border-radius:99px;padding:3px 11px;font-size:12.5px}
.badge{background:var(--yel);color:#3a2a00;font-weight:700;border-radius:6px;padding:3px 9px;font-size:12px;display:inline-block}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:none;border:0;background:transparent;color:var(--ink);padding:8px 13px;border-radius:99px;font:600 13.5px Arial,sans-serif;cursor:pointer}
nav button.on{background:var(--blue);color:#fff}
main{max-width:1060px;margin:0 auto;padding:16px 14px 40px}
h2{color:var(--h);margin:6px 0 12px;font-size:21px}h3{color:var(--h);margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
ul,ol{margin:6px 0;padding-left:21px}li{margin:3px 0}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:14px}
.kpi{border-radius:12px;padding:12px;color:#fff}.kpi b{display:block;font-size:24px}.kpi small{opacity:.92}
.k1{background:#0a66c2}.k2{background:#7a3fd1}.k3{background:#d9480f}.k4{background:#0c8f6f}.k5{background:#c2185b}.k6{background:#1b3a6b}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:8px;white-space:nowrap}td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td input{width:84px;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff8dd;color:#14213d;font:inherit}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.p0{background:#0a66c2}.p1{background:#7a3fd1}.p2{background:#d9480f}.p3{background:#0c8f6f}.p4{background:#c2185b}
.btn{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:8px 14px;font:700 13px Arial,sans-serif;cursor:pointer;margin:2px 4px 2px 0}
.btn.alt{background:var(--yel);color:#3a2a00}
pre{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;margin:8px 0;font:14px/1.5 Arial,sans-serif}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}.mut{color:var(--mut);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
.bars div{flex:1;text-align:center;font-size:12px}.bars i{display:block;border-radius:6px 6px 0 0;min-height:2px}
.loop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:8px 0}
.node{background:var(--card);border:2px solid var(--blue);border-radius:12px;padding:9px 13px;text-align:center;font-weight:700;font-size:13px}
.node small{display:block;font-weight:400;color:var(--mut)}.node.c{background:var(--yel);border-color:var(--yel);color:#3a2a00}

const D={"meta": {"Project Code": "LIL-2025-P1", "Department": "Career Development & Digital Branding", "Priority": "High", "Timeline": "6 Weeks (Phase 1)", "Version": "1.0", "Date": "10 Nov 2026"}, "persona": {"label": "SAMPLE PERSONA (dummy data for demonstration)", "name": "Riya Sharma (sample)", "role": "Data Analyst, 3 years of experience", "goal": "Grow into a Senior Analyst / Analytics Lead role", "industry": "Data & Analytics", "audience": "Aspiring and early-career data analysts; recruiters and hiring managers in analytics", "role_models": ["Role Model A (sample): analytics lead who shares weekly SQL tips", "Role Model B (sample): career coach who posts short micro-stories", "Role Model C (sample): data-visualisation practitioner who posts carousels"], "competitors": ["Peer Profile X (sample): posts daily, mostly generic motivational content"]}, "pillars": ["Career insights", "Thought leadership", "Personal journey", "Industry trends", "Actionable tips"], "formats": ["Text post", "Carousel", "Poll", "Micro-story"], "audit": [["Headline", "Data Analyst at [Company]", "Data Analyst | Turning messy data into clear decisions | SQL, Excel, Power BI | Sharing practical analytics career tips"], ["About (opening lines)", "Experienced data analyst looking for new opportunities.", "I help teams turn messy data into decisions they can act on. I share practical SQL, Excel and career lessons for early-career analysts every week."], ["Banner", "Default LinkedIn banner", "Branded banner showing the niche: Data & Analytics, SQL, storytelling, career tips"], ["Featured section", "Empty", "Pin the best-performing carousel and one portfolio project"], ["Positioning", "Generic data analyst", "Analytics storyteller for early-career analysts"], ["Posting habit", "Irregular, a few posts a year", "Two to three posts per week from the 6-week content calendar"], ["Engagement habit", "Rarely comments on others’ posts", "Reply to every comment and comment on peer posts regularly"]], "checklist": ["Professional profile photo", "Headline states role, value and niche", "About section opens with value, not job history", "Branded banner image", "Featured section holds proof of work", "Top skills aligned with content pillars", "Experience bullets show outcomes", "Custom profile URL", "Contact and creator settings reviewed", "Role models and peers followed"], "ideas": [[1, "First SQL query returned zero rows", "Personal journey", "Post 1"], [2, "3 checks before sharing any dashboard", "Actionable tips", "Post 2"], [3, "Poll: what matters most in a junior analyst portfolio", "Career insights", "Post 3"], [4, "AI can draft your analysis, not know your business", "Industry trends", "Post 4"], [5, "A dashboard doesn’t make a decision, a question does", "Thought leadership", "Post 5"], [6, "What your LinkedIn profile shows in a few seconds", "Career insights", "Post 6"], [7, "SQL joins in 5 slides (carousel)", "Actionable tips", "Post 7"], [8, "My first rejected application", "Personal journey", "Post 8"], [9, "3 takeaways from an article on data literacy", "Industry trends", "Post 9"], [10, "The best analysts ask one more question", "Thought leadership", "Post 10"], [11, "Poll: which skill to learn first this quarter", "Career insights", "Post 11"], [12, "Six weeks of posting: what I learned", "Personal journey", "Post 12"], [13, "An Excel shortcut that saved me an hour", "Actionable tips", "Backlog"], [14, "Why I document every analysis", "Thought leadership", "Backlog"], [15, "What I’d tell my first-year self about stakeholder meetings", "Personal journey", "Backlog"]], "posts": [{"id": 1, "week": 2, "date": "24 Nov 2026", "day": "Tue", "pillar": "Personal journey", "format": "Micro-story", "tpl": "A", "hook": "My first SQL query returned zero rows. I thought I’d broken the database.", "body": "My first SQL query returned zero rows.\n\nI was sure I had broken something.\n\nThe cause: I had filtered on ’North ’ with a trailing space. One invisible character. Forty minutes of panic.\n\nWhat it taught me: when a result looks wrong, check the data before you doubt yourself.\n\nWhat is the smallest bug that ever cost you the most time?", "tags": "#SQL #DataAnalytics #CareerJourney"}, {"id": 2, "week": 2, "date": "26 Nov 2026", "day": "Thu", "pillar": "Actionable tips", "format": "Text post", "tpl": "A", "hook": "Before you share any dashboard, run these 3 checks.", "body": "Before you share any dashboard, run these 3 checks:\n\n1. Do the totals match the source?\n2. Are there blanks or duplicates hiding in your key column?\n3. Does every chart title say what the reader should notice?\n\nTwo minutes of checking saves a week of ’why doesn’t this match?’ emails.\n\nWhich check would you add?", "tags": "#Excel #DataAnalytics #Dashboards"}, {"id": 3, "week": 2, "date": "27 Nov 2026", "day": "Fri", "pillar": "Career insights", "format": "Poll", "tpl": "A", "hook": "Junior analysts: what matters most in a portfolio?", "body": "Junior analysts: what matters most in a portfolio?\n\nPoll options:\n- Clean data projects\n- Clear storytelling\n- Technical depth (SQL, Python)\n- Business impact\n\nI’m curious what hiring managers and fellow analysts look for. Vote, then tell me in the comments what I missed.", "tags": "#DataAnalytics #Portfolio #CareerAdvice"}, {"id": 4, "week": 3, "date": "01 Dec 2026", "day": "Tue", "pillar": "Industry trends", "format": "Text post", "tpl": "B", "hook": "AI can draft your analysis. It can’t know your business.", "body": "AI can draft your analysis. It can’t know your business.\n\nTools now produce first drafts of queries, summaries and charts quickly. What stays human is knowing which question matters and whether the answer makes sense for this business.\n\nMy rule: AI drafts, I review, test and rewrite in my own words.\n\nHow are you using AI in your analysis work?", "tags": "#AI #DataAnalytics #FutureOfWork"}, {"id": 5, "week": 3, "date": "03 Dec 2026", "day": "Thu", "pillar": "Thought leadership", "format": "Text post", "tpl": "B", "hook": "A dashboard doesn’t make a decision. A question does.", "body": "A dashboard doesn’t make a decision. A question does.\n\nMany dashboards start with ’what data do we have?’ The better ones start with ’what decision are we making?’\n\nBefore building, write down:\n- the decision\n- the person making it\n- the one number that would change their mind\n\nThen build the smallest view that shows it.", "tags": "#DataStorytelling #Analytics"}, {"id": 6, "week": 4, "date": "07 Dec 2026", "day": "Mon", "pillar": "Career insights", "format": "Text post", "tpl": "A", "hook": "Your LinkedIn profile gets a few seconds. Make them count.", "body": "Your LinkedIn profile gets a few seconds. Make them count.\n\nThree things do most of the work:\n1. Headline: what you do and who you help\n2. First lines of About: the value, not the job history\n3. Featured: one piece of proof\n\nFix those three before touching anything else.\n\nWhat does your headline say right now?", "tags": "#PersonalBranding #LinkedInTips"}, {"id": 7, "week": 4, "date": "09 Dec 2026", "day": "Wed", "pillar": "Actionable tips", "format": "Carousel", "tpl": "A", "hook": "SQL joins in 5 slides.", "body": "Carousel outline (5 slides)\nSlide 1: SQL joins in 5 slides\nSlide 2: INNER JOIN returns only matching rows\nSlide 3: LEFT JOIN keeps all left rows and adds matches from the right\nSlide 4: Common mistake: joining on a non-unique key duplicates rows\nSlide 5: Quick check: compare row counts before and after the join\n\nCaption: Save this for your next query or interview.", "tags": "#SQL #DataAnalytics #LearnSQL"}, {"id": 8, "week": 4, "date": "11 Dec 2026", "day": "Fri", "pillar": "Personal journey", "format": "Micro-story", "tpl": "B", "hook": "My first rejected application taught me more than I expected.", "body": "My first rejected application taught me more than I expected.\n\nI had sent the same generic resume to every role.\n\nSo I changed one thing: I rewrote the top three bullets for each job, using that job’s own wording.\n\nFewer applications. Better ones.\n\nWhat is one change that improved your job search?", "tags": "#JobSearch #CareerGrowth #DataCareers"}, {"id": 9, "week": 5, "date": "14 Dec 2026", "day": "Mon", "pillar": "Industry trends", "format": "Text post", "tpl": "C", "hook": "3 takeaways on data literacy at work.", "body": "I read an article on data literacy at work. My 3 takeaways:\n\n1. Everyone who uses numbers needs to question them.\n2. Plain-language explanations beat technical ones.\n3. Training works best when tied to real daily tasks.\n\nSource: [article title and link, add before publishing]\n\nDo you agree?", "tags": "#DataLiteracy #Analytics"}, {"id": 10, "week": 5, "date": "16 Dec 2026", "day": "Wed", "pillar": "Thought leadership", "format": "Text post", "tpl": "B", "hook": "The best analysts I know ask one more question.", "body": "The best analysts I know ask one more question.\n\nA request arrives: ’Send me last month’s sales.’\nThe extra question: ’What decision will this help you make?’\n\nThat one question turns a data dump into an answer people actually use.\n\nWhat is your go-to clarifying question?", "tags": "#Analytics #Stakeholders #DataStorytelling"}, {"id": 11, "week": 5, "date": "18 Dec 2026", "day": "Fri", "pillar": "Career insights", "format": "Poll", "tpl": "A", "hook": "Which skill would you learn first this quarter?", "body": "Which skill would you learn first this quarter?\n\nPoll options:\n- Advanced SQL\n- Python\n- Power BI or Tableau\n- Communication and storytelling\n\nTell me why in the comments. I’ll share what I’m picking.", "tags": "#DataAnalytics #Upskilling #CareerGrowth"}, {"id": 12, "week": 6, "date": "22 Dec 2026", "day": "Tue", "pillar": "Personal journey", "format": "Text post", "tpl": "B", "hook": "Six weeks of posting on LinkedIn: what I learned.", "body": "Six weeks of posting on LinkedIn. What I learned from 12 posts:\n\n1. Specific beats clever.\n2. Polls and carousels got the most reactions.\n3. A content calendar made consistency easy.\n\nNext: keep posting twice a week and do more of what worked.\n\nWhat has helped you stay consistent?", "tags": "#PersonalBranding #LinkedIn #Consistency"}], "calendar": [{"week": 1, "date": "16 Nov 2026", "day": "Mon", "pillar": "Profile audit + content pillars", "format": "No post", "hook": "No post scheduled", "body": "Week 1 is the personal branding audit and content pillar definition (Section 22)."}, {"week": 2, "date": "24 Nov 2026", "day": "Tue", "pillar": "Personal journey", "format": "Micro-story", "hook": "My first SQL query returned zero rows. I thought I’d broken the database.", "body": "My first SQL query returned zero rows.\n\nI was sure I had broken something.\n\nThe cause: I had filtered on ’North ’ with a trailing space. One invisible character. Forty minutes of panic.\n\nWhat it taught me: when a result looks wrong, check the data before you doubt yourself.\n\nWhat is the smallest bug that ever cost you the most time?\n\n#SQL #DataAnalytics #CareerJourney"}, {"week": 2, "date": "26 Nov 2026", "day": "Thu", "pillar": "Actionable tips", "format": "Text post", "hook": "Before you share any dashboard, run these 3 checks.", "body": "Before you share any dashboard, run these 3 checks:\n\n1. Do the totals match the source?\n2. Are there blanks or duplicates hiding in your key column?\n3. Does every chart title say what the reader should notice?\n\nTwo minutes of checking saves a week of ’why doesn’t this match?’ emails.\n\nWhich check would you add?\n\n#Excel #DataAnalytics #Dashboards"}, {"week": 2, "date": "27 Nov 2026", "day": "Fri", "pillar": "Career insights", "format": "Poll", "hook": "Junior analysts: what matters most in a portfolio?", "body": "Junior analysts: what matters most in a portfolio?\n\nPoll options:\n- Clean data projects\n- Clear storytelling\n- Technical depth (SQL, Python)\n- Business impact\n\nI’m curious what hiring managers and fellow analysts look for. Vote, then tell me in the comments what I missed.\n\n#DataAnalytics #Portfolio #CareerAdvice"}, {"week": 3, "date": "01 Dec 2026", "day": "Tue", "pillar": "Industry trends", "format": "Text post", "hook": "AI can draft your analysis. It can’t know your business.", "body": "AI can draft your analysis. It can’t know your business.\n\nTools now produce first drafts of queries, summaries and charts quickly. What stays human is knowing which question matters and whether the answer makes sense for this business.\n\nMy rule: AI drafts, I review, test and rewrite in my own words.\n\nHow are you using AI in your analysis work?\n\n#AI #DataAnalytics #FutureOfWork"}, {"week": 3, "date": "03 Dec 2026", "day": "Thu", "pillar": "Thought leadership", "format": "Text post", "hook": "A dashboard doesn’t make a decision. A question does.", "body": "A dashboard doesn’t make a decision. A question does.\n\nMany dashboards start with ’what data do we have?’ The better ones start with ’what decision are we making?’\n\nBefore building, write down:\n- the decision\n- the person making it\n- the one number that would change their mind\n\nThen build the smallest view that shows it.\n\n#DataStorytelling #Analytics"}, {"week": 4, "date": "07 Dec 2026", "day": "Mon", "pillar": "Career insights", "format": "Text post", "hook": "Your LinkedIn profile gets a few seconds. Make them count.", "body": "Your LinkedIn profile gets a few seconds. Make them count.\n\nThree things do most of the work:\n1. Headline: what you do and who you help\n2. First lines of About: the value, not the job history\n3. Featured: one piece of proof\n\nFix those three before touching anything else.\n\nWhat does your headline say right now?\n\n#PersonalBranding #LinkedInTips"}, {"week": 4, "date": "09 Dec 2026", "day": "Wed", "pillar": "Actionable tips", "format": "Carousel", "hook": "SQL joins in 5 slides.", "body": "Carousel outline (5 slides)\nSlide 1: SQL joins in 5 slides\nSlide 2: INNER JOIN returns only match const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const ul=a=>"<ul>"+a.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
const pc=p=>`<span class="tag p${D.pillars.indexOf(p)}">${esc(p)}</span>`;

const copy=(txt,btn)=>{const done=()=>{const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=o,1200)};
 try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}
 function fb(){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}a.remove()}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(b)copy(b.dataset.copy,b)});

/* ---------- engagement state ---------- */
const sampleState=()=>{const s={};D.posts.forEach(p=>s[p.id]=D.metrics[p.id].slice());return s};
const blankState=()=>{const s={};D.posts.forEach(p=>s[p.id]=["","","","",""]);return s};
let S;try{S=JSON.parse(localStorage.getItem("lil_metrics")||"null")}catch(e){S=null}
if(!S||!D.posts.every(p=>Array.isArray(S[p.id])))S=sampleState();
const save=()=>{try{localStorage.setItem("lil_metrics",JSON.stringify(S))}catch(e){}};
const num=v=>v===""||v==null||isNaN(+v)?0:+v;
const rows=()=>D.posts.map(p=>{const m=S[p.id].map(num);return{...p,imp:m[0],lk:m[1],cm:m[2],sh:m[3],pv:m[4],eng:m[1]+m[2]+m[3]}});
const pct=(a,b)=>b>0?(100*a/b).toFixed(1)+"%":"0.0%";
function bars(vals,labels,col){const mx=Math.max(1,...vals);return`<div class="bars">${vals.map((v,i)=>`<div><small>${v}</small><i style="height:${Math.round(v/mx*100)}px;background:${col}"></i>${labels[i]}</div>`).join("")}</div>`}
function dash(){
 const R=rows(),T=k=>R.reduce((a,r)=>a+r[k],0),tr=R.filter(r=>r.imp>0),wk=[1,2,3,4,5,6].map(w=>R.filter(r=>r.week==w));
 const top=[...tr].sort((a,b)=>b.eng-a.eng)[0];
 const fm=D.formats.map(f=>{const r=R.filter(x=>x.format==f);return[esc(f),r.filter(x=>x.imp>0).length,r.reduce((a,x)=>a+x.imp,0),pct(r.reduce((a,x)=>a+x.eng,0),r.reduce((a,x)=>a+x.imp,0))]});
 const chk=(ok,t)=>`<li><span class="${ok?"ok":"no"}">${ok?"\u2713":"\u2717"}</span> ${t}</li>`;
 $("dash").innerHTML=`<div class="kpis">
 <div class="kpi k1"><b>${tr.length}</b><small>Posts tracked</small></div><div class="kpi k2"><b>${T("imp").toLocaleString()}</b><small>Impressions</small></div>
 <div class="kpi k3"><b>${T("lk")}</b><small>Likes</small></div><div class="kpi k4"><b>${T("cm")}</b><small>Comments</small></div>
 <div class="kpi k5"><b>${T("sh")}</b><small>Shares</small></div><div class="kpi k6"><b>${T("pv")}</b><small>Profile visits</small></div></div>
 <div class="grid"><div class="card"><h3>Impressions by week</h3>${bars(wk.map(r=>r.reduce((a,x)=>a+x.imp,0)),wk.map((_,i)=>"W"+(i+1)),"#0a66c2")}</div>
 <div class="card"><h3>Engagement growth by week (likes + comments + shares)</h3>${bars(wk.map(r=>r.reduce((a,x)=>a+x.eng,0)),wk.map((_,i)=>"W"+(i+1)),"#d9480f")}</div></div>
 <div class="grid"><div class="card"><h3>Weekly engagement rate</h3>${tbl(["Week","Posts","Engagement rate"],wk.map((r,i)=>["Week "+(i+1),r.filter(x=>x.imp>0).length,pct(r.reduce((a,x)=>a+x.eng,0),r.reduce((a,x)=>a+x.imp,0))]))}</div>
 <div class="card"><h3>Results by format</h3>${tbl(["Format","Posts","Impressions","Rate"],fm)}
 <p><b>Top post:</b> ${top?`Post ${top.id} (${esc(top.pillar)}, ${esc(top.format)}) with ${top.eng} engagements`:"n/a until you enter values"}</p>
 <p><b>Overall engagement rate:</b> ${pct(T("eng"),T("imp"))}</p></div></div>
 <div class="card"><h3>Acceptance criteria (live)</h3><ul style="list-style:none;padding:0">
 ${chk(D.ideas.length>=15,`At least 15 content ideas generated and refined: ${D.ideas.length}`)}
 ${chk(tr.length>=10,`Minimum of 10 posts published in Phase 1: ${tr.length} tracked`)}
 ${chk(tr.length===D.posts.length,`Engagement metrics tracked for each post: ${tr.length}/${D.posts.length}`)}
 ${chk([1,2,3,4,5,6].every(w=>D.calendar.some(c=>c.week==w)),"Clear content calendar delivered for the next 6 weeks")}
 ${chk(true,"Performance review report with improvement recommendations: Performance_Review_Report.docx")}</ul></div>`}
function engagement(){
 $("view").innerHTML=`<h2>Engagement Dashboard</h2><p><span class="badge">${esc(sample())}</span> <span class="mut">Values below are dummy sample data. Type your own numbers in the yellow cells and the dashboard updates instantly.</span></p>
 <button class="btn" id="bs">Load sample values</button><button class="btn alt" id="bc">Clear values to enter my own</button>
 <div id="dash" style="margin-top:12px"></div>
 <div class="card"><h3>Engagement Tracking Sheet</h3><div class="scroll"><table><tr><th>Post</th><th>Date</th><th>Pillar</th><th>Format</th><th>Impressions</th><th>Likes</th><th>Comments</th><th>Shares</th><th>Profile visits</th></tr>
 ${D.posts.map(p=>`<tr><td>${p.id}</td><td>${esc(p.date)}</td><td>${pc(p.pillar)}</td><td>${esc(p.format)}</td>${[0,1,2,3,4].map(i=>`<td><input type="number" min="0" data-p="${p.id}" data-i="${i}" value="${S[p.id][i]}"></td>`).join("")}</tr>`).join("")}</table></div></div>`;
 const setAll=s=>{S=s;save();engagement()};
 $("bs").onclick=()=>setAll(sampleState());$("bc").onclick=()=>setAll(blankState());
 $("view").oninput=e=>{const t=e.target;if(t.dataset.p){S[t.dataset.p][t.dataset.i]=t.value;save();dash()}};
 dash()}

function route(){const t=(location.hash||"#overview").slice(1),k=V[t]?t:"overview";

 if(k==="engagement")engagement();else $("view").innerHTML=V[k]();
 if(k==="audit"){let c={};try{c=JSON.parse(localStorage.getItem("lil_cl")||"{}")}catch(e){}
  document.querySelectorAll("#cl input").forEach(i=>{i.checked=!!c[i.dataset.c];i.onchange=()=>{c[i.dataset.c]=i.checked;try{localStorage.setItem("lil_cl",JSON.stringify(c))}catch(e){}}})}
 window.scrollTo(0,0)}
