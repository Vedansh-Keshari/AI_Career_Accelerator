<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233250F2'/%3E%3Ccircle cx='12' cy='13' r='6' fill='%23fff'/%3E%3Ccircle cx='21' cy='20' r='6' fill='%2312D6A8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#panel">Skip to editor</a>
<header class="topbar">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>Canvas Studio</span></div>
  <label class="title-wrap"><span class="sr">Project title</span>
    <input id="title" class="title-input" maxlength="120" placeholder="Project title" autocomplete="off" disabled>
  </label>
  <div class="top-actions">
    <details class="menu" id="downloadMenu">
      <summary class="btn ghost">Download</summary>
      <div class="menu-pop" id="downloadLinks"></div>
    </details>
    <button id="canvaChip" class="chip" type="button"></button>
    <button id="pushBtn" class="btn primary" type="button" disabled>Push to Canva</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>

<main class="shell">
  <nav class="rail" aria-label="Projects">
    <button id="newBtn" class="btn solid" type="button">New project</button>
    <ul id="projectList" class="plist"></ul>
  </nav>

  <section class="stage" aria-label="Preview">
    <div id="empty" class="empty" hidden>
      <h2>Start something</h2>
      <p>Try one of the three scenarios from the Canva AI notes, or describe your own idea.</p>
      <button class="btn primary" type="button" data-action="open-new">New project</button>
    </div>
    <div id="work" hidden>
      <div class="paper" id="paper"><img id="preview" alt="Preview of the selected page"></div>
      <div class="strip" id="strip" role="list"></div>
    </div>
  </section>

  <aside class="inspector" aria-label="Editor">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="content" type="button">Content</button>
      <button role="tab" data-tab="look" type="button">Look</button>
      <button role="tab" data-tab="refine" type="button">Refine</button>
      <button role="tab" data-tab="canva" type="button">Canva</button>
    </div>
    <div id="panel" class="panel" tabindex="-1"></div>
  </aside>
</main>

<dialog id="newDlg" aria-labelledby="newTitle">
  <div class="dlg-head">
    <h2 id="newTitle">New project</h2>
    <button class="btn ghost" type="button" data-action="close-new" aria-label="Close">Close</button>
  </div>
  <div class="seg" role="tablist" id="newTabs">
    <button type="button" role="tab" data-newtab="example" aria-selected="true">From the notes</button>
    <button type="button" role="tab" data-newtab="idea" aria-selected="false">From my idea</button>
  </div>
  <div id="newBody"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
