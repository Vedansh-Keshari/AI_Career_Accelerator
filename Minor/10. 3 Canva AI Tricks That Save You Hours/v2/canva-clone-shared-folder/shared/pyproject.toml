[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["**/golden", "**/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "PL"]
ignore = [
  "E501",    # long lines are checked by the formatter-free style used here
  "PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911", "PLW0603", "PLW2901",  # size/complexity limits suit renderers poorly
  "PLC0415", "C408", "PLR0917", "UP031",  # lazy imports are deliberate (optional libraries, import cycles)
  "SIM105", "SIM108", "UP037", "UP006", "UP007", "UP035", "B905", "B904", "E701", "E702", "E731",
]

[tool.ruff.lint.isort]
known-first-party = ["studio"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["studio"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::pytest.PytestUnhandledThreadExceptionWarning"]
