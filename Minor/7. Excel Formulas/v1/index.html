@media(max-width:860px){
.app{display:block}

.brand{display:none}.tabs{flex-direction:row;width:100%}.tab{flex:1;text-align:center;padding:10px 2px;font-size:14px}

@media(prefers-reduced-motion:no-preference){.opt,.chip,.go{transition:background .15s,border-color .15s}}

  LEFT:(t,n)=>txt(t).slice(0,n==null?1:num(n)),

const D={"sheet":[["Order ID","Channel","Amount","Month"],["ORD-101","Amazon Prime",1200,7],["ORD-102","Flipkart",850,3],["ORD-103","Amazon Fresh",430,7],["ORD-104","Myntra",1500,5],["ORD-105","Amazon Prime",990,7],["ORD-106","Flipkart",2100,9],["ORD-107","Myntra",640,3],["ORD-108","Amazon Fresh",780,11],["ORD-109","Flipkart",1350,7],["ORD-110","Amazon Prime",560,5]],"sections":[{"id":"text","title":"IFERROR and text functions","blurb":"Handle errors gracefully and pull pieces out of text.","fns":[{"name":"IFERROR","syntax":"=IFERROR(value, value_if_error)","what":"Returns your own fallback value instead of an error such as #N/A or #DIV/0!.","ex":[{"f":"=IFERROR(XLOOKUP(\"ORD-999\",A2:A11,C2:C11),\"Not found\")","n":"ORD-999 does not exist, so the lookup errors and \"Not found\" is shown instead.","x":"Not found"},{"f":"=IFERROR(C2/0,0)","n":"Dividing by zero would give #DIV/0!, so 0 is returned.","x":"0"}]},{"name":"LEFT","syntax":"=LEFT(text, [num_chars])","what":"Extracts characters from the start of the text.","ex":[{"f":"=LEFT(A2,3)","n":"Takes the first 3 characters of ORD-101.","x":"ORD"}]},{"name":"RIGHT","syntax":"=RIGHT(text, [num_chars])","what":"Extracts characters from the end of the text.","ex":[{"f":"=RIGHT(A2,3)","n":"Takes the last 3 characters of ORD-101.","x":"101"}]},{"name":"MID","syntax":"=MID(text, start_num, num_chars)","what":"Extracts a set number of characters from the middle of the text, starting at a position you choose.","ex":[{"f":"=MID(B2,8,5)","n":"Starts at character 8 of \"Amazon Prime\" and takes 5 characters.","x":"Prime"}]}]},{"id":"dynamic","title":"Text joins and dynamic arrays","blurb":"Join text, generate number sequences and move dates by months.","fns":[{"name":"& (ampersand)","syntax":"=A2 & \", \" & B2","what":"Joins pieces of text (and cell values) into one string.","ex":[{"f":"=A2&\" - \"&B2","n":"Combines the order ID, a dash and the channel.","x":"ORD-101 - Amazon Prime"}]},{"name":"SEQUENCE","syntax":"=SEQUENCE(rows, [columns], [start], [step])","what":"Generates a series of numbers that spills into the cells below and beside it.","ex":[{"f":"=SEQUENCE(4,1,10,5)","n":"4 rows, 1 column, starting at 10, stepping by 5."},{"f":"=SEQUENCE(3,2)","n":"A 3 by 2 grid counting from 1."}]},{"name":"EDATE","syntax":"=EDATE(start_date, months)","what":"Moves a date forward or backward by a number of months. Use a negative number to go back.","ex":[{"f":"=EDATE(\"2026-01-31\",1)","n":"One month after 31 Jan lands on the last day of February.","x":"2026-02-28"},{"f":"=EDATE(\"2026-03-15\",-2)","n":"A negative value moves two months earlier.","x":"2026-01-15"}]}]},{"id":"rank","title":"LARGE, SMALL, SUMIFS and FILTER","blurb":"Rank values, add up by condition and pull out matching rows.","fns":[{"name":"LARGE","syntax":"=LARGE(array, k)","what":"Returns the nth highest value in a range. k is the rank.","ex":[{"f":"=LARGE(C2:C11,2)","n":"The 2nd highest amount.","x":"1500"}]},{"name":"SMALL","syntax":"=SMALL(array, k)","what":"Returns the nth lowest value in a range. k is the rank.","ex":[{"f":"=SMALL(C2:C11,1)","n":"The lowest amount.","x":"430"}]},{"name":"SUMIFS","syntax":"=SUMIFS(sum_range, criteria_range1, criteria1, [criteria_range2, criteria2], ...)","what":"Adds up values that meet one or more conditions. Wildcards such as * work in text criteria.","ex":[{"f":"=SUMIFS(C2:C11,D2:D11,7)","n":"Total amount for month 7.","x":"3970"},{"f":"=SUMIFS(C2:C11,B2:B11,\"Amazon*\")","n":"Total for every channel that starts with Amazon.","x":"3960"}]},{"name":"FILTER","syntax":"=FILTER(array, include, [if_empty])","what":"Extracts the rows that meet a condition. The results spill into the adjacent cells.","ex":[{"f":"=FILTER(A2:C11,D2:D11=7)","n":"All orders placed in month 7."},{"f":"=FILTER(A2:C11,C2:C11>5000,\"None\")","n":"No amount is above 5000, so the if_empty text is returned.","x":"None"}]}]},{"id":"lookup","title":"XLOOKUP and INDEX MATCH","blurb":"Find a value in one column and return the matching value from another.","fns":[{"name":"XLOOKUP","syntax":"=XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found], [match_mode], [search_mode])","what":"A modern lookup that can replace VLOOKUP and HLOOKUP. It finds a value in one column and returns the matching value from another.","ex":[{"f":"=XLOOKUP(\"ORD-106\",A2:A11,C2:C11,\"Not found\")","n":"Finds ORD-106 and returns its amount. The 4th argument is shown if nothing matches.","x":"2100"}]},{"name":"INDEX + MATCH","syntax":"=INDEX(return_array, MATCH(lookup_value, lookup_array, match_type), [column_num])","what":"MATCH finds the position of a value (match_type 0 means exact match) and INDEX returns the item at that position. Together they are very flexible, especially for the intersection of a row and a column.","ex":[{"f":"=INDEX(C2:C11,MATCH(\"ORD-106\",A2:A11,0))","n":"MATCH returns position 6 and INDEX returns the 6th amount.","x":"2100"},{"f":"=INDEX(A2:D11,MATCH(\"ORD-106\",A2:A11,0),2)","n":"Uses the optional column number to return the 2nd column (Channel) of that row.","x":"Flipkart"}]}]}],"quiz":[{"s":"text","q":"What does =IFERROR(A1/B1,0) return when B1 is 0?","o":["#DIV/0!","0","A blank cell","The value of A1"],"a":1,"e":"IFERROR replaces the error with the fallback value you supplied, here 0."},{"s":"text","q":"What does =LEFT(\"ORD-101\",3) return?","o":["ORD","101","D-1","ORD-"],"a":0,"e":"LEFT takes characters from the start of the text."},{"s":"text","q":"Which function extracts characters from the middle of a text?","o":["LEFT","RIGHT","MID","IFERROR"],"a":2,"e":"MID needs a start position and a number of characters."},{"s":"dynamic","q":"Which operator joins text together?","o":["+","&",",","|"],"a":1,"e":"The ampersand joins text, for example =A2 & \", \" & B2."},{"s":"dynamic","q":"What does =SEQUENCE(4,1,10,5) generate?","o":["10, 15, 20, 25","1, 2, 3, 4","10, 11, 12, 13","5, 10, 15, 20"],"a":0,"e":"4 rows, 1 column, start at 10, step 5."},{"s":"dynamic","q":"What does - \" between them.","ans":"=A3&\" - \"&B3"},{"s":"dynamic","t":"Generate the numbers 1 to 5 down a single column.","ans":"=SEQUENCE(5)"},{"s":"dynamic","t":"Find the date 3 months after 2026-11-30.","ans":"=EDATE(\"2026-11-30\",3)"},{"s":"rank","t":"Find the 3rd highest Amount.","ans":"=LARGE(C2:C11,3)"},{"s":"rank","t":"Total the Amount for orders placed in month 7.","ans":"=SUMIFS(C2:C11,D2:D11,7)"},{"s":"rank","t":"List every row where the Channel is Flipkart (columns A to D).","ans":"=FILTER(A2:D11,B2:B11=\"Flipkart\")"},{"s":"lookup","t":"Return the Channel for ORD-110 using INDEX and MATCH.","ans":"=INDEX(B2:B11,MATCH(\"ORD-110\",A2:A11,0))"}]};
const {evaluate,fmt}=XL;
const S=D.sections;
const allFns=S.flatMap(s=>s.fns.map(f=>({...f,sec:s.id,secTitle:s.title})));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('xfl_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('xfl_'+k,JSON.stringify(v))}catch(e){}}};
const TABS=[['ref','Reference'],['quiz','Quiz'],['cards','Flashcards'],['lab','Practice']];
const HEAD={ref:['Excel formulas','Every function from your notes with a plain explanation and a worked example.'],quiz:['Quiz','Pick the right answer. You get an explanation after each question.'],cards:['Flashcards','Read the function, recall the syntax, then flip to check.'],lab:['Practice','Type a formula against the sample sheet. Pick a task or try your own.']};
const st={tab:store.get('tab','ref'),sec:'all'};
let Q=null,F=null,P={t:-1,f:'',res:null,show:false},installEv=null;
function resHTML(v){if(Array.isArray(v))return '<table class="out">'+v.map(r=>'<tr>'+r.map(c=>`<td>${esc(c===null?'':c)}</td>`).join('')+'</tr>').join('')+'</table>';return `<span class="val">${esc(v===null?'':v)}</span>`}
function run(f){const r=evaluate(f,D.sheet);return r.ok?resHTML(r.value):`<span class="err">${esc(r.error)}</span>`}
function chips(){return `<div class="chips" role="group" aria-label="Section">${[['all','All sections'],...S.map(s=>[s.id,s.title])].map(([id,t])=>`<button class="chip" data-act="sec" data-v="${id}" aria-pressed="${st.sec===id}">${esc(t)}</button>`).join('')}</div>`}
function ref(){return S.filter(s=>st.sec==='all'||s.id===st.sec).map(s=>`<section><h2>${esc(s.title)}</h2><p class="lead">${esc(s.blurb)}</p>${s.fns.map(f=>`<article class="fn"><h3>${esc(f.name)}</h3><p>${esc(f.what)}</p><code class="syn">${esc(f.syntax)}</code>${f.ex.map(e=>`<div class="ex"><div class="fx"><b>fx</b><code>${esc(e.f)}</code></div><div class="res">${run(e.f)}</div><p class="note">${esc(e.n)}</p></div>`).join('')}</article>`).join('')}</section>`).join('')}
function quiz(){
 if(!Q){const pool=D.quiz.filter(q=>st.sec==='all'||q.s===st.sec);Q={list:shuffle(pool).map(q=>({...q,idx:shuffle(q.o.map((_,i)=>i))})),i:0,score:0,picked:null}}
 if(Q.i>=Q.list.length){const k='best_'+st.sec,b=Math.max(store.get(k,0),Q.score);store.set(k,b);
  return `<div class="card"><p class="meta">Quiz complete</p><h2 class="big">${Q.score} / ${Q.list.length}</h2><p>Best score for this selection: ${b} / ${Q.list.length}</p><button class="go" data-act="restart">Try again</button></div>`}
 const q=Q.list[Q.i],done=Q.picked!==null;
 return `<div class="card"><p class="meta">Question ${Q.i+1} of ${Q.list.length}</p><h2 class="q">${esc(q.q)}</h2><div class="opts">${q.idx.map((oi,k)=>{let c='';if(done){if(oi===q.a)c='right';else if(k===Q.picked)c='wrong'}return `<button class="opt ${c}" data-act="pick" data-v="${k}" ${done?'disabled':''}>${esc(q.o[oi])}</button>`}).join('')}</div>${done?`<p class="why"><b>${q.idx[Q.picked]===q.a?'Correct.':'Not quite.'}</b> ${esc(q.e)}</p><button class="go" data-act="next">${Q.i+1<Q.list.length?'Next question':'See score'}</button>`:''}</div>`}
function cards(){
 if(!F)F={list:allFns.filter(f=>st.sec==='all'||f.sec===st.sec),i:0,flip:false};
 const f=F.list[F.i],e=f.ex[0];
 const front=`<div class="face"><p class="meta">${esc(f.secTitle)}</p><h2 class="mono">${esc(f.name)}</h2><p>${esc(f.what)}</p><p class="hint">Tap the card to see the syntax and an example.</p></div>`;
 const back=`<div class="face"><p class="meta">Syntax</p><code class="blk">${esc(f.syntax)}</code><p class="meta">Example</p><div class="fx"><b>fx</b><code>${esc(e.f)}</code></div><div class="res">${run(e.f)}</div><p class="note">${esc(e.n)}</p></div>`;
 return `<p class="meta">Card ${F.i+1} of ${F.list.length}</p><div class="flash" data-act="flip" role="button" tabindex="0" aria-label="Flip card">${F.flip?back:front}</div><div class="row"><button class="go sec" data-act="prev">Previous</button><button class="go" data-act="flip">Flip</button><button class="go sec" data-act="nextc">Next</button><button class="go sec" data-act="shuf">Shuffle</button></div>`}
function lab(){
 const done=store.get('done',[]),cur=P.t>=0?D.tasks[P.t]:null;
 const tasks=D.tasks.map((t,i)=>({...t,i})).filter(t=>st.sec==='all'||t.s===st.sec);
 const sheet=`<div class="sheetwrap"><table class="sheet"><tr><th></th>${['A','B','C','D'].map(c=>`<th>${c}</th>`).join('')}</tr>${D.sheet.map((r,i)=>`<tr><th>${i+1}</th>${r.map(c=>`<td${i?'':' style="font-weight:700"'}>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 let out='';
 if(P.res){if(!P.res.ok)out=`<div class="res"><span class="err">${esc(P.res.error)}</span></div>`;
  else{out=`<div class="res">${resHTML(P.res.value)}</div>`;if(cur)out+=P.res.correct?'<p class="verdict ok">Correct. That matches the expected result.</p>':'<p class="verdict">The result differs from what the task asks for. Check the task and try again.</p>'}}
 const ans=cur?(P.show?`<p class="note">Answer: <code>${esc(cur.ans)}</code></p>`:`<button class="go sec" data-act="ans">Show answer</button>`):'';
 return `<p class="meta">Sample sheet (cells A1 to D11)</p>${sheet}
 <div class="tasks"><button class="task" data-act="task" data-v="-1" aria-pressed="${P.t===-1}">Free practice</button>${tasks.map(t=>`<button class="task" data-act="task" data-v="${t.i}" aria-pressed="${P.t===t.i}">${done.includes(t.i)?'&#10003; ':''}${esc(t.t)}</button>`).join('')}</div>
 <div class="fx"><b>fx</b><input id="fi" class="mono" value="${esc(P.f)}" placeholder="=LEFT(A2,3)" aria-label="Formula" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="go" data-act="run" style="border-radius:0">Run</button></div>${out}<div class="row">${ans}</div>`}
function runLab(){const r=evaluate(P.f,D.sheet);P.res=r;P.show=false;
 if(P.t>=0&&r.ok){const exp=evaluate(D.tasks[P.t].ans,D.sheet);r.correct=fmt(r.value)===fmt(exp.value);
  if(r.correct){const d=store.get('done',[]);if(!d.includes(P.t)){d.push(P.t);store.set('done',d)}}}
 render();const i=$('#fi');if(i)i.focus()}
function render(){
 $('.tabs').innerHTML=TABS.map(([id,t])=>`<button class="tab" role="tab" data-act="tab" data-v="${id}" aria-selected="${st.tab===id}">${t}</button>`).join('');
 const [h,sub]=HEAD[st.tab];
 $('#view').innerHTML=`<div class="top"><div><h1>${h}</h1><p class="lead">${sub}</p></div>${installEv?'<button class="go" data-act="install">Install app</button>':''}</div>${chips()}${({ref,quiz,cards,lab})[st.tab]()}`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==='tab'){st.tab=v;store.set('tab',v)}
 else if(a==='sec'){st.sec=v;Q=null;F=null;P={t:-1,f:'',res:null,show:false}}
 else if(a==='pick'){const q=Q.list[Q.i];if(Q.picked!==null)return;Q.picked=+v;if(q.idx[+v]===q.a)Q.score++}
 else if(a==='next'){Q.i++;Q.picked=null}
 else if(a==='restart')Q=null;
 else if(a==='flip')F.flip=!F.flip;
 else if(a==='prev'){F.i=(F.i-1+F.list.length)%F.list.length;F.flip=false}
 else if(a==='nextc'){F.i=(F.i+1)%F.list.length;F.flip=false}
 else if(a==='shuf'){F.list=shuffle(F.list);F.i=0;F.flip=false}
 else if(a==='task'){P={t:+v,f:'',res:null,show:false}}
 else if(a==='ans')P.show=true;
 else if(a==='run'){const i=$('#fi');if(i)P.f=i.value;runLab();return}
 else if(a==='install'){installEv.prompt();installEv=null}
 render()});
document.addEventListener('input',e=>{if(e.target.id==='fi')P.f=e.target.value});
document.addEventListener('keydown',e=>{
 if(e.target.id==='fi'&&e.key==='Enter'){P.f=e.target.value;runLab();return}
 if(st.tab!=='cards'||!F||e.target.closest('input'))return;
 if(e.key==='ArrowRight'){F.i=(F.i+1)%F.list.length;F.flip=false;render()}
 else if(e.key==='ArrowLeft'){F.i=(F.i-1+F.list.length)%F.list.length;F.flip=false;render()}
 else if(e.key===' '||e.key==='Enter'){e.preventDefault();F.flip=!F.flip;render()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;render()});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
