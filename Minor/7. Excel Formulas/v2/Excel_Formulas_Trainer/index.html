:root{--f-head:'Fredoka','Trebuchet MS',system-ui,sans-serif;--f-body:'Nunito','Segoe UI',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
--bg:#f3f6ff;--panel:#fff;--ink:#17212b;--mute:#5a6878;--line:#d9e1ec;--g:#1d6f42;--gd:#14532f;--gt:#e3f5ea;--sel:#fde047;--selink:#3b2f00;--err:#c62828;--code:#f5f8fb;--onG:#fff;--onSC:#fff;--sc:var(--g);--tc:#1d6f42;--shadow:0 6px 18px rgba(30,50,90,.10);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d1420;--panel:#162130;--ink:#e8eef6;--mute:#9fb0c4;--line:#2a3a50;--g:#46b983;--gd:#8be0b6;--gt:#18362b;--sel:#fde047;--selink:#3b2f00;--err:#ff8a80;--code:#1b293a;--onG:#06150d;--onSC:#0b1411;--shadow:0 6px 18px rgba(0,0,0,.35)}}
[data-sec=text]{--sc:#0d9488}[data-sec=dynamic]{--sc:#7c3aed}[data-sec=rank]{--sc:#ea580c}[data-sec=lookup]{--sc:#db2777}
@media(prefers-color-scheme:dark){[data-sec=text]{--sc:#2dd4bf}[data-sec=dynamic]{--sc:#a78bfa}[data-sec=rank]{--sc:#fb923c}[data-sec=lookup]{--sc:#f472b6}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:17px/1.6 var(--f-body);background:var(--bg);color:var(--ink);background-image:radial-gradient(circle at 0 0,rgba(124,58,237,.12),transparent 40%),radial-gradient(circle at 100% 0,rgba(13,148,136,.14),transparent 38%),radial-gradient(circle at 100% 100%,rgba(219,39,119,.10),transparent 40%);background-attachment:fixed}
code,.mono{font-family:var(--f-mono)}
h1,h2,h3,h4,.brand{font-family:var(--f-head);font-weight:600}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,#0f3d2a,#1d6f42 55%,#0d9488);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;margin-bottom:18px}
.mark{width:40px;height:40px;border-radius:12px;background:#fde047;color:#14532f;display:grid;place-items:center;font:italic 700 18px Georgia,serif;transform:rotate(-6deg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tabs{display:flex;flex-direction:column;gap:6px}
.tab{cursor:pointer;padding:11px 14px;border-radius:14px;font:700 16px var(--f-body);color:rgba(255,255,255,.88);background:none;border:0;text-align:left;display:flex;align-items:center;gap:10px}
.tab::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--tc);border:2px solid #fff;flex:none}
.tab:hover{background:rgba(255,255,255,.14)}
.tab[aria-selected=true]{background:#fff;color:#14231c;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.tab[data-t=ref]{--tc:#22c55e}.tab[data-t=quiz]{--tc:#fb923c}.tab[data-t=cards]{--tc:#a78bfa}.tab[data-t=lab]{--tc:#f472b6}.tab[data-t=flow]{--tc:#38bdf8}
button:focus-visible,input:focus-visible,.flash:focus-visible{outline:3px solid #fde047;outline-offset:2px;box-shadow:0 0 0 5px #14532f}
main{padding:24px clamp(16px,4vw,48px) 60px;max-width:1040px;width:100%}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:22px 26px;border-radius:22px;color:#fff;background:linear-gradient(120deg,#1d6f42,#0d9488 55%,#2563eb);box-shadow:var(--shadow);position:relative;overflow:hidden}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.top::before{width:130px;height:130px;right:-30px;top:-50px;background:#fde047;opacity:.9}
.top::after{width:80px;height:80px;right:90px;bottom:-40px;background:#f472b6;opacity:.85}
.top>*{position:relative;z-index:1}
h1{font-size:30px;margin:0 0 2px;line-height:1.2}
.top .lead{color:rgba(255,255,255,.92);margin:2px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}
.chip{border:2px solid var(--sc);background:color-mix(in srgb,var(--sc) 12%,var(--panel));color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;font:700 14px var(--f-body)}
.chip[data-sec=all]{--sc:#2563eb}
.chip[aria-pressed=true]{background:var(--sc);color:var(--onSC);box-shadow:0 3px 0 color-mix(in srgb,var(--sc) 60%,#000)}
.btn{border:0;cursor:pointer;font:800 15px var(--f-body);padding:10px 20px;color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,#22c55e,#0d9488);color:#04230f;border-radius:999px;box-shadow:0 6px 16px rgba(13,148,136,.45)}
.btn.soft{background:color-mix(in srgb,var(--sc) 18%,var(--panel));color:var(--ink);border-radius:12px}
.btn.ghost{background:transparent;border:2px solid var(--sc);border-radius:12px;color:var(--ink)}
.btn.chunky{background:#ff8a1f;color:#2b1200;border-radius:12px;border-bottom:5px solid #b45309}
.btn.chunky:active{transform:translateY(3px);border-bottom-width:2px}
.btn:hover{filter:brightness(1.06)}
section h2{font-size:23px;margin:34px 0 4px;padding:6px 16px;border-radius:14px;color:var(--onSC);background:var(--sc);display:inline-block}
.lead{color:var(--mute);margin:4px 0 14px}
.fn{background:var(--panel);border:2px solid color-mix(in srgb,var(--sc) 30%,var(--line));border-left:10px solid var(--sc);border-radius:16px;padding:16px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.fn h3{display:inline-block;margin:0 0 6px;font:700 17px var(--f-mono);background:var(--sc);color:var(--onSC);padding:3px 14px;border-radius:999px}
.fn p{margin:4px 0 10px}
.syn{display:block;background:color-mix(in srgb,var(--sc) 10%,var(--panel));border-left:4px solid var(--sc);padding:9px 12px;border-radius:8px;font-size:14px;overflow-x:auto;white-space:nowrap}
.ex{margin-top:14px}
.fx{display:flex;border:2px solid var(--sc);border-radius:10px;overflow:hidden;background:var(--panel);align-items:stretch}
.fx b{padding:6px 12px;background:var(--sc);color:var(--onSC);font:italic 700 15px Georgia,serif;display:flex;align-items:center}
.fx code,.fx input{flex:1;min-width:0;padding:7px 12px;font-size:14px;overflow-x:auto;white-space:nowrap;border:0;background:transparent;color:var(--ink)}
.res{margin:8px 0 0;overflow-x:auto}
.val{display:inline-block;background:var(--sel);color:var(--selink);padding:2px 12px;border-radius:8px;font:700 14px var(--f-mono)}
.err{color:var(--err);font:700 14px var(--f-mono)}
.note{margin:6px 0 0!important;color:var(--mute);font-size:15px}
.remember{background:#fef9c3;border:2px dashed #eab308;border-radius:16px;padding:10px 18px;margin:4px 0 8px;color:#422006}
.remember h4{margin:0 0 2px;font-size:18px}.remember ul{margin:4px 0 6px;padding-left:20px}
table{border-collapse:collapse;font-size:14px}
table.out td{border:1px solid #ca8a04;padding:3px 10px;background:var(--sel);color:var(--selink);font-family:var(--f-mono)}
.sheetwrap{overflow-x:auto;margin:10px 0 16px}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:4px 14px;background:var(--panel);white-space:nowrap}
table.sheet th{background:#d1fae5;color:#14532f;font-weight:800}
@media(prefers-color-scheme:dark){table.sheet th{background:#18362b;color:#8be0b6}}
table.sheet tr:nth-child(2) td{background:color-mix(in srgb,#2563eb 14%,var(--panel));font-weight:800}
.card{background:var(--panel);border:2px solid color-mix(in srgb,var(--sc) 30%,var(--line));border-top:10px solid var(--sc);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.meta{color:var(--mute);font-size:14px;font-weight:700;margin:0 0 8px}
.q{font-size:23px;margin:0 0 16px;line-height:1.3}
.opts{display:grid;gap:10px;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--panel);color:var(--ink);font:700 16px var(--f-body);cursor:pointer}
.badge{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sc);color:var(--onSC);display:grid;place-items:center;font:700 14px var(--f-head)}
.opt:hover:not(:disabled){border-color:var(--sc)}.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt.right{background:#bbf7d0;border-color:#16a34a;color:#052e16}.opt.wrong{background:#fecaca;border-color:#dc2626;color:#450a0a}
.why{margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.big{font-size:56px;margin:0 0 6px;color:var(--sc)}
.flash{background:linear-gradient(135deg,color-mix(in srgb,var(--sc) 20%,var(--panel)),var(--panel));border:3px solid var(--sc);border-radius:22px;min-height:250px;padding:26px;cursor:pointer;display:flex;align-items:center;box-shadow:var(--shadow)}
.face{width:100%}.face h2{font-size:32px;margin:0 0 10px;color:var(--sc)}
.hint{color:var(--mute);font-size:14px;margin-top:18px}
.blk{display:block;background:color-mix(in srgb,var(--sc) 10%,var(--panel));border-left:4px solid var(--sc);padding:8px 12px;border-radius:8px;margin:0 0 14px;font-size:14px;overflow-x:auto;white-space:nowrap}
.tasks{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.task{text-align:left;padding:10px 14px;border:2px solid color-mix(in srgb,var(--sc) 45%,var(--line));border-radius:12px;background:var(--panel);color:var(--ink);font:700 15px var(--f-body);cursor:pointer}
.task[aria-pressed=true]{background:var(--sc);color:var(--onSC)}
.task:not([data-sec]){--sc:#2563eb}
.verdict{margin:10px 0 0;font-weight:800}.ok{color:#16a34a}
.flowwrap{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow-x:auto;padding:6px}
.flowwrap svg{display:block;width:100%;min-width:860px;height:auto}
@media(max-width:860px){
.app{display:block}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.brand{display:none}.tabs{flex-direction:row;width:100%;gap:2px}.tab{flex:1;justify-content:center;padding:9px 0;font-size:12px;gap:4px}.tab::before{width:8px;height:8px;border-width:1px}
main{padding-bottom:100px;padding-top:max(16px,env(safe-area-inset-top))}
.top{padding:18px}h1{font-size:25px}}
@media(prefers-reduced-motion:no-preference){.opt,.chip,.btn,.tab{transition:background .15s,border-color .15s,transform .1s,filter .15s}}

function run(f){const r=evaluate(f,D.sheet);return r.ok?resHTML(r.value):`<span class="err">${esc(r.error)}</span>`}
function chips(){return `<div class="chips" role="group" aria-label="Section">${[['all','All sections'],...S.map(s=>[s.id,s.title])].map(([id,t])=>`<button class="chip" data-act="sec" data-v="${id}" data-sec="${id}" aria-pressed="${st.sec===id}">${esc(t)}</button>`).join('')}</div>`}
function ref(){return S.filter(s=>st.sec==='all'||s.id===st.sec).map(s=>`<section><h2>${esc(s.title)}</h2><p class="lead">${esc(s.blurb)}</p>${s.fns.map(f=>`<article class="fn" data-sec="${s.id}"><h3>${esc(f.name)}</h3><p>${esc(f.what)}</p><code class="syn">${esc(f.syntax)}</code>${f.ex.map(e=>`<div class="ex"><div class="fx"><b>fx</b><code>${esc(e.f)}</code></div><div class="res">${run(e.f)}</div><p class="note">${esc(e.n)}</p></div>`).join('')}</article>`).join('')}${s.rem?`<div class="remember"><h4>Remember</h4><ul>${s.rem.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`:''}</section>`).join('')}
function quiz(){
 if(!Q){const pool=D.quiz.filter(q=>st.sec==='all'||q.s===st.sec);Q={list:shuffle(pool).map(q=>({...q,idx:shuffle(q.o.map((_,i)=>i))})),i:0,score:0,picked:null}}
 if(Q.i>=Q.list.length){const k='best_'+st.sec,b=Math.max(store.get(k,0),Q.score);store.set(k,b);
  return `<div class="card"><p class="meta">Quiz complete</p><h2 class="big">${Q.score} / ${Q.list.length}</h2><p>Best score for this selection: ${b} / ${Q.list.length}</p><button class="btn primary" data-act="restart">Try again</button></div>`}
 const q=Q.list[Q.i],done=Q.picked!==null;
 return `<div class="card" data-sec="${q.s}"><p class="meta">Question ${Q.i+1} of ${Q.list.length}</p><h2 class="q">${esc(q.q)}</h2><div class="opts">${q.idx.map((oi,k)=>{let c='';if(done){if(oi===q.a)c='right';else if(k===Q.picked)c='wrong'}return `<button class="opt ${c}" data-act="pick" data-v="${k}" ${done?'disabled':''}><span class="badge">${'ABCD'[k]}</span>${esc(q.o[oi])}</button>`}).join('')}</div>${done?`<p class="why"><b>${q.idx[Q.picked]===q.a?'Correct.':'Not quite.'}</b> ${esc(q.e)}</p><button class="btn primary" data-act="next">${Q.i+1<Q.list.length?'Next question':'See score'}</button>`:''}</div>`}
function cards(){
 if(!F)F={list:allFns.filter(f=>st.sec==='all'||f.sec===st.sec),i:0,flip:false};
 const f=F.list[F.i],e=f.ex[0];
 const front=`<div class="face"><p class="meta">${esc(f.secTitle)}</p><h2 class="mono">${esc(f.name)}</h2><p>${esc(f.what)}</p><p class="hint">Tap the card to see the syntax and an example.</p></div>`;
 const back=`<div class="face"><p class="meta">Syntax</p><code class="blk">${esc(f.syntax)}</code><p class="meta">Example</p><div class="fx"><b>fx</b><code>${esc(e.f)}</code></div><div class="res">${run(e.f)}</div><p class="note">${esc(e.n)}</p></div>`;
 return `<p class="meta">Card ${F.i+1} of ${F.list.length}</p><div class="flash" data-sec="${f.sec}" data-act="flip" role="button" tabindex="0" aria-label="Flip card">${F.flip?back:front}</div><div class="row"><button class="btn ghost" data-act="prev">&larr; Previous</button><button class="btn chunky" data-act="flip">Flip card</button><button class="btn ghost" data-act="nextc">Next &rarr;</button><button class="btn soft" data-act="shuf">Shuffle</button></div>`}
function lab(){
 const done=store.get('done',[]),cur=P.t>=0?D.tasks[P.t]:null;
 const tasks=D.tasks.map((t,i)=>({...t,i})).filter(t=>st.sec==='all'||t.s===st.sec);
 const sheet=`<div class="sheetwrap"><table class="sheet"><tr><th></th>${['A','B','C','D'].map(c=>`<th>${c}</th>`).join('')}</tr>${D.sheet.map((r,i)=>`<tr><th>${i+1}</th>${r.map(c=>`<td${i?'':' style="font-weight:700"'}>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 let out='';
 if(P.res){if(!P.res.ok)out=`<div class="res"><span class="err">${esc(P.res.error)}</span></div>`;
  else{out=`<div class="res">${resHTML(P.res.value)}</div>`;if(cur)out+=P.res.correct?'<p class="verdict ok">Correct. That matches the expected result.</p>':'<p class="verdict">The result differs from what the task asks for. Check the task and try again.</p>'}}
 const ans=cur?(P.show?`<p class="note">Answer: <code>${esc(cur.ans)}</code></p>`:`<button class="btn soft" data-act="ans">Show answer</button>`):'';
 return `<p class="meta">Sample sheet (cells A1 to D11)</p>${sheet}
 <div class="tasks"><button class="task" data-act="task" data-v="-1" aria-pressed="${P.t===-1}">Free practice</button>${tasks.map(t=>`<button class="task" data-sec="${t.s}" data-act="task" data-v="${t.i}" aria-pressed="${P.t===t.i}">${done.includes(t.i)?'&#10003; ':''}${esc(t.t)}</button>`).join('')}</div>
 <div class="fx"><b>fx</b><input id="fi" class="mono" value="${esc(P.f)}" placeholder="=LEFT(A2,3)" aria-label="Formula" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="btn chunky" data-act="run" style="border-radius:0">Run</button></div>${out}<div class="row">${ans}</div>`}
function flow(){return `<div class="flowwrap">${D.flow}</div><p class="note">Tip: on a phone, scroll sideways to see every column.</p>`}
function runLab(){const r=evaluate(P.f,D.sheet);P.res=r;P.show=false;
 if(P.t>=0&&r.ok){const exp=evaluate(D.tasks[P.t].ans,D.sheet);r.correct=fmt(r.value)===fmt(exp.value);
  if(r.correct){const d=store.get('done',[]);if(!d.includes(P.t)){d.push(P.t);store.set('done',d)}}}
 render();const i=$('#fi');if(i)i.focus()}
function render(){
 $('.tabs').innerHTML=TABS.map(([id,t])=>`<button class="tab" role="tab" data-act="tab" data-t="${id}" data-v="${id}" aria-selected="${st.tab===id}">${t}</button>`).join('');
 const [h,sub]=HEAD[st.tab];
 $('#view').innerHTML=`<div class="top"><div><h1>${h}</h1><p class="lead">${sub}</p></div>${installEv?'<button class="btn primary" data-act="install">Install app</button>':''}</div>${st.tab==='flow'?'':chips()}${({ref,quiz,cards,lab,flow})[st.tab]()}`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==='tab'){st.tab=v;store.set('tab',v)}
 else if(a==='sec'){st.sec=v;Q=null;F=null;P={t:-1,f:'',res:null,show:false}}
 else if(a==='pick'){const q=Q.list[Q.i];if(Q.picked!==null)return;Q.picked=+v;if(q.idx[+v]===q.a)Q.score++}
 else if(a==='next'){Q.i++;Q.picked=null}
 else if(a==='restart')Q=null;
 else if(a==='flip')F.flip=!F.flip;
 else if(a==='prev'){F.i=(F.i-1+F.list.length)%F.list.length;F.flip=false}
 else if(a==='nextc'){F.i=(F.i+1)%F.list.length;F.flip=false}
 else if(a==='shuf'){F.list=shuffle(F.list);F.i=0;F.flip=false}
 else if(a==='task'){P={t:+v,f:'',res:null,show:false}}
 else if(a==='ans')P.show=true;
 else if(a==='run'){const i=$('#fi');if(i)P.f=i.value;runLab();return}
 else if(a==='install'){installEv.prompt();installEv=null}
 render()});
document.addEventListener('input',e=>{if(e.target.id==='fi')P.f=e.target.value});
document.addEventListener('keydown',e=>{
 if(e.target.id==='fi'&&e.key==='Enter'){P.f=e.target.value;runLab();return}
 if(st.tab!=='cards'||!F||e.target.closest('input'))return;
 if(e.key==='ArrowRight'){F.i=(F.i+1)%F.list.length;F.flip=false;render()}
 else if(e.key==='ArrowLeft'){F.i=(F.i-1+F.list.length)%F.list.length;F.flip=false;render()}
 else if(e.key===' '||e.key==='Enter'){e.preventDefault();F.flip=!F.flip;render()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;render()});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
