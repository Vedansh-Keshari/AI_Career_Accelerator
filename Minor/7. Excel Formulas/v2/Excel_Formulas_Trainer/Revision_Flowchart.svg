<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1074" width="1240" height="1074" role="img" aria-label="Flowchart: choose an Excel formula by what you need to do"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1240" height="1074" rx="18" fill="#ffffff"/><text x="620" y="32.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569">Excel formulas: Lookup, Logic &amp; Dynamic Arrays</text><rect x="380" y="48" width="480" height="62" rx="31" fill="#1d6f42" stroke="#14532f" stroke-width="2"/><text x="620" y="87.4" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="26" font-weight="600" fill="#ffffff">What do you need to do?</text><line x1="620" y1="110" x2="620" y2="132" stroke="#64748b" stroke-width="2.5"/><line x1="155" y1="132" x2="1085" y2="132" stroke="#64748b" stroke-width="2.5"/><line x1="155" y1="132" x2="155" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/><line x1="465" y1="132" x2="465" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/><line x1="775" y1="132" x2="775" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/><line x1="1085" y1="132" x2="1085" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/><line x1="155" y1="240" x2="155" y2="956" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="3 7"/><line x1="465" y1="240" x2="465" y2="956" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="3 7"/><line x1="775" y1="240" x2="775" y2="956" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="3 7"/><line x1="1085" y1="240" x2="1085" y2="956" stroke="#db2777" stroke-width="2.5" stroke-dasharray="3 7"/><rect x="15" y="152" width="280" height="88" rx="18" fill="#0d9488" stroke="#0d9488" stroke-width="2"/><text x="155" y="190.3" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Fix errors, cut text</text><text x="155" y="222.5" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#ffffff">IFERROR · LEFT · RIGHT · MID</text><rect x="15" y="264" width="280" height="62" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="155" y="290.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Hide an error with your own</text><text x="155" y="310.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">value?</text><line x1="155" y1="326" x2="155" y2="352" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ah)"/><rect x="15" y="352" width="280" height="37" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="3"/><text x="155" y="375.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#0d9488">IFERROR(value, value_if_error)</text><rect x="15" y="413" width="280" height="62" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="155" y="439.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Take characters from the</text><text x="155" y="459.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">start?</text><line x1="155" y1="475" x2="155" y2="501" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ah)"/><rect x="15" y="501" width="280" height="37" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="3"/><text x="155" y="524.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#0d9488">LEFT(text, [num_chars])</text><rect x="15" y="562" width="280" height="42" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="155" y="588.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Take characters from the end?</text><line x1="155" y1="604" x2="155" y2="630" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ah)"/><rect x="15" y="630" width="280" height="37" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="3"/><text x="155" y="653.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#0d9488">RIGHT(text, [num_chars])</text><rect x="15" y="691" width="280" height="62" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="155" y="717.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Take characters from the</text><text x="155" y="737.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">middle?</text><line x1="155" y1="753" x2="155" y2="779" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ah)"/><rect x="15" y="779" width="280" height="54" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="3"/><text x="155" y="802.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#0d9488">MID(text, start_num,</text><text x="155" y="819.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#0d9488">num_chars)</text><rect x="15" y="857" width="280" height="73" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/><text x="155" y="881.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">LEFT starts at the beginning,</text><text x="155" y="898.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">RIGHT at the end, MID in the</text><text x="155" y="915.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">middle.</text><rect x="325" y="152" width="280" height="88" rx="18" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="465" y="190.3" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Join, count, move dates</text><text x="465" y="222.5" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#ffffff">&amp; · SEQUENCE · EDATE</text><rect x="325" y="264" width="280" height="42" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="465" y="290.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Join text together?</text><line x1="465" y1="306" x2="465" y2="332" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ah)"/><rect x="325" y="332" width="280" height="37" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="465" y="355.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">A2 &amp; ", " &amp; B2</text><rect x="325" y="393" width="280" height="42" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="465" y="419.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Generate numbers or dates?</text><line x1="465" y1="435" x2="465" y2="461" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ah)"/><rect x="325" y="461" width="280" height="54" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="465" y="484.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">SEQUENCE(rows, [columns],</text><text x="465" y="501.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">[start], [step])</text><rect x="325" y="539" width="280" height="42" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="465" y="565.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Move a date by months?</text><line x1="465" y1="581" x2="465" y2="607" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ah)"/><rect x="325" y="607" width="280" height="37" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="465" y="630.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">EDATE(start_date, months)</text><rect x="325" y="668" width="280" height="56" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/><text x="465" y="692.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">EDATE months can be positive or</text><text x="465" y="709.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">negative.</text><rect x="635" y="152" width="280" height="88" rx="18" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="775" y="190.3" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Rank, total, extract</text><text x="775" y="222.5" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#ffffff">LARGE · SMALL · SUMIFS · FILTER</text><rect x="635" y="264" width="280" height="42" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="775" y="290.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Need the nth highest value?</text><line x1="775" y1="306" x2="775" y2="332" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ah)"/><rect x="635" y="332" width="280" height="37" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="3"/><text x="775" y="355.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#ea580c">LARGE(array, k)</text><rect x="635" y="393" width="280" height="42" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="775" y="419.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Need the nth lowest value?</text><line x1="775" y1="435" x2="775" y2="461" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ah)"/><rect x="635" y="461" width="280" height="37" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="3"/><text x="775" y="484.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#ea580c">SMALL(array, k)</text><rect x="635" y="522" width="280" height="62" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="775" y="548.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Sum with one or more</text><text x="775" y="568.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">conditions?</text><line x1="775" y1="584" x2="775" y2="610" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ah)"/><rect x="635" y="610" width="280" height="71" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="3"/><text x="775" y="633.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#ea580c">SUMIFS(sum_range,</text><text x="775" y="650.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#ea580c">criteria_range1, criteria1,</text><text x="775" y="667.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#ea580c">...)</text><rect x="635" y="705" width="280" height="42" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="775" y="731.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Pull out the rows that match?</text><line x1="775" y1="747" x2="775" y2="773" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ah)"/><rect x="635" y="773" width="280" height="54" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="3"/><text x="775" y="796.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#ea580c">FILTER(array, include,</text><text x="775" y="813.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#ea580c">[if_empty])</text><rect x="635" y="851" width="280" height="56" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/><text x="775" y="875.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">In LARGE and SMALL, k is the</text><text x="775" y="892.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">rank.</text><rect x="945" y="152" width="280" height="88" rx="18" fill="#db2777" stroke="#db2777" stroke-width="2"/><text x="1085" y="190.3" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Look something up</text><text x="1085" y="222.5" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#ffffff">XLOOKUP · INDEX MATCH</text><rect x="945" y="264" width="280" height="62" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1085" y="290.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Find a value, return another</text><text x="1085" y="310.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">column?</text><line x1="1085" y1="326" x2="1085" y2="352" stroke="#db2777" stroke-width="2.5" marker-end="url(#ah)"/><rect x="945" y="352" width="280" height="71" rx="14" fill="#ffffff" stroke="#db2777" stroke-width="3"/><text x="1085" y="375.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#db2777">XLOOKUP(lookup_value,</text><text x="1085" y="392.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#db2777">lookup_array, return_array,</text><text x="1085" y="409.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#db2777">[if_not_found])</text><rect x="945" y="447" width="280" height="62" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1085" y="473.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Complex task or row and column</text><text x="1085" y="493.6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#1e293b">intersection?</text><line x1="1085" y1="509" x2="1085" y2="535" stroke="#db2777" stroke-width="2.5" marker-end="url(#ah)"/><rect x="945" y="535" width="280" height="88" rx="14" fill="#ffffff" stroke="#db2777" stroke-width="3"/><text x="1085" y="558.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#db2777">INDEX(return_array,</text><text x="1085" y="575.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#db2777">MATCH(lookup_value,</text><text x="1085" y="592.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#db2777">lookup_array, 0),</text><text x="1085" y="609.3" text-anchor="middle" font-family="JetBrains Mono, sans-serif" font-size="12" font-weight="700" fill="#db2777">[column_num])</text><rect x="945" y="647" width="280" height="73" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/><text x="1085" y="671.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">XLOOKUP can replace VLOOKUP and</text><text x="1085" y="688.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">HLOOKUP. In MATCH, 0 means exact</text><text x="1085" y="705.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#713f12">match.</text><line x1="155" y1="956" x2="1085" y2="956" stroke="#64748b" stroke-width="2.5"/><line x1="620" y1="956" x2="620" y2="978" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="15" y="980" width="1210" height="74" rx="20" fill="#fde047" stroke="#ca8a04" stroke-width="3"/><text x="620" y="1011.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="17" font-weight="800" fill="#422006">Still seeing an error? Wrap the formula: =IFERROR(your formula, value_if_error)</text><text x="620" y="1037.3" text-anchor="middle" font-family="Nunito, sans-serif" font-size="17" font-weight="800" fill="#422006">Then test it on a small sample first and check the result.</text></svg>